<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle</title>
    <script defer src="./app.js"></script>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div class="hidden">
        <div class="hidden">
            <h1>Wordle</h1>
            <h2>Choose diffuclty level</h2>
            <div id="diffucltyLevel"><button id="easy">Easy</button>
                <button id="Modrate">Modrate</button>
                <button id="hard">Hard</button>
            </div>
        </div>
        <div class="hidden">
            <h2>Choose language</h2>
            <button>عربي</button>
            <li><button>English</button></li>
        </div>
    </div>

    <span class="hide" id="message"></span>

    <div id="big-board" class="hide">
        <div id="gameBoard">
            <div class="wordContainer hide">
                <p class="word"></p>
                <p class="word"></p>
                <p class="word"></p>
                <p class="word"></p>
                <p class="word"></p>
            </div>

            <div class="wordContainer hide">
                <p class="word 1"></p>
                <p class="word 1"></p>
                <p class="word 1"></p>
                <p class="word 1"></p>
                <p class="word 1"></p>
            </div>


            <div class="wordContainer hide">
                <p class="word 2"></p>
                <p class="word 2"></p>
                <p class="word 2"></p>
                <p class="word 2"></p>
                <p class="word 2"></p>
            </div>


            <div class="wordContainer hide">
                <p class="word 3"></p>
                <p class="word 3"></p>
                <p class="word 3"></p>
                <p class="word 3"></p>
                <p class="word 3"></p>
            </div>


            <div class="wordContainer hide">
                <p class="word 4"></p>
                <p class="word 4"></p>
                <p class="word 4"></p>
                <p class="word 4"></p>
                <p class="word 4"></p>
            </div>

        </div>

    </div>

    <div id="lettersBTNS" class="hidden hide">
        <button class="EngKey">Q</button> <button class="EngKey">W</button> <button class="EngKey">E</button> <button
            class="EngKey">R</button> <button class="EngKey">T</button> <button class="EngKey">Y</button> <button
            class="EngKey">U</button> <button class="EngKey">I</button> <button class="EngKey">O</button> <button
            class="EngKey">P</button>
        <br>
        <button class="EngKey">A</button> <button class="EngKey">S</button> <button class="EngKey">D</button> <button
            class="EngKey">F</button> <button class="EngKey">G</button> <button class="EngKey">H</button> <button
            class="EngKey">J</button> <button class="EngKey">K</button> <button class="EngKey">L</button>
        <br>
        <button id="delete">⌫</button> <button class="EngKey">Z</button> <button class="EngKey">X</button> <button
            class="EngKey">C</button> <button class="EngKey">V</button> <button class="EngKey">B</button> <button
            class="EngKey">N</button> <button class="EngKey">M</button> <button id="EngEnter">Enter</button>

    </div>

    <button id="playAgain" class="hide">Play again!</button>





</body>

</html>
